name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime and validation tools
        run: |
          timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 120s sudo apt-get install -y \
            dbus-x11 desktop-file-utils \
            gir1.2-adw-1 gir1.2-gtk-4.0 \
            python3-cairo python3-evdev python3-gi python3-tk \
            shellcheck xvfb

      - name: Compile every Python file
        run: |
          find . -type f -name '*.py' -not -path './.git/*' -print0 \
            | xargs -0 -r /usr/bin/python3 -m py_compile

      - name: Validate shell syntax
        run: |
          bash -n install.sh uninstall.sh

      - name: Check shell errors
        run: |
          shellcheck -S error install.sh uninstall.sh

      - name: Validate SVG assets
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("icons").rglob("*.svg"))
          if not files:
              raise SystemExit("No SVG assets found")
          for path in files:
              ET.parse(path)
              print(f"OK {path}")
          PY

      - name: Validate desktop launcher template
        run: |
          set -euo pipefail
          desktop_file="$(mktemp --suffix=.desktop)"
          trap 'rm -f "$desktop_file"' EXIT
          sed -n '/^cat > "\$DESKTOP_FILE" <<DESKTOP$/,/^DESKTOP$/p' install.sh | sed '1d;$d' > "$desktop_file"
          test -s "$desktop_file"
          sed -i \
            -e 's|\$BIN_DIR|/home/padshift/.local/bin|g' \
            -e 's|\$APP_ID|io.github.privacyfreak84.PadShift|g' \
            "$desktop_file"
          desktop-file-validate "$desktop_file"

      - name: Run automated test suite
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: /usr/bin/python3 -m unittest discover -s tests -v
